<svg xmlns="http://www.w3.org/2000/svg" width="480" height="120" viewBox="0 0 480 120" role="img" aria-label="Most Used Languages">
  <style>
    .header { font: 600 14px 'Segoe UI', Ubuntu, Sans-Serif; fill: #22d3ee }
    .lang-name { font: 400 12px 'Segoe UI', Ubuntu, Sans-Serif; fill: #c9d1d9 }
    .lang-pct { font: 400 12px 'Segoe UI', Ubuntu, Sans-Serif; fill: #8b949e }
  </style>
  <rect x="0.5" y="0.5" rx="10" height="119" width="479" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
  <text x="20" y="28" class="header">Most Used Languages</text>
  
  <!-- Multi-segment Progress Bar -->
  <mask id="bar-mask">
    <rect x="20" y="44" width="440" height="8" rx="4" fill="white"/>
  </mask>
  <g mask="url(#bar-mask)">
    <rect x="20" y="44" width="370" height="8" fill="#f1e05a"/>
    <rect x="390" y="44" width="40" height="8" fill="#3178c6"/>
    <rect x="430" y="44" width="18" height="8" fill="#f34b7d"/>
    <rect x="448" y="44" width="12" height="8" fill="#e34c26"/>
  </g>

  <!-- Legend Items -->
  <g transform="translate(20, 75)">
    <!-- JavaScript -->
    <circle cx="5" cy="5" r="4" fill="#f1e05a"/>
    <text x="15" y="9" class="lang-name">JavaScript</text>
    <text x="80" y="9" class="lang-pct">84.2%</text>

    <!-- TypeScript -->
    <circle cx="140" cy="5" r="4" fill="#3178c6"/>
    <text x="150" y="9" class="lang-name">TypeScript</text>
    <text x="218" y="9" class="lang-pct">9.1%</text>

    <!-- C++ -->
    <circle cx="275" cy="5" r="4" fill="#f34b7d"/>
    <text x="285" y="9" class="lang-name">C++</text>
    <text x="312" y="9" class="lang-pct">4.1%</text>

    <!-- HTML/CSS -->
    <circle cx="365" cy="5" r="4" fill="#e34c26"/>
    <text x="375" y="9" class="lang-name">HTML/CSS</text>
    <text x="440" y="9" class="lang-pct">2.6%</text>
  </g>
</svg>