<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A101F" />
      <stop offset="50%" stop-color="#1E1B4B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="client-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0.05" />
    </linearGradient>
    <linearGradient id="server-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#A78BFA" stop-opacity="0.05" />
    </linearGradient>
    <linearGradient id="data-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.05" />
    </linearGradient>
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38BDF8" />
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#C084FC" />
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect width="900" height="360" rx="16" fill="url(#bg-grad)" stroke="#1E293B" stroke-width="2" />

  <!-- Subgraph 1: Client Layer -->
  <g transform="translate(30, 30)">
    <rect width="250" height="300" rx="12" fill="url(#client-grad)" stroke="#0284C7" stroke-width="1.5" stroke-dasharray="4 4" />
    <text x="125" y="32" fill="#38BDF8" font-family="'Fira Code', monospace" font-size="14" font-weight="700" text-anchor="middle">💻 CLIENT LAYER</text>

    <!-- Node UI -->
    <rect x="25" y="60" width="200" height="60" rx="8" fill="#0F172A" stroke="#38BDF8" stroke-width="1.5" />
    <text x="125" y="88" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">React.js &amp; Next.js App</text>
    <text x="125" y="106" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Tailwind CSS • Redux Toolkit</text>

    <!-- Arrow down -->
    <path d="M 125 120 L 125 170" stroke="#38BDF8" stroke-width="2" marker-end="url(#arrow)" />

    <!-- Node API Client -->
    <rect x="25" y="180" width="200" height="60" rx="8" fill="#0F172A" stroke="#38BDF8" stroke-width="1.5" />
    <text x="125" y="208" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">API Gateway Client</text>
    <text x="125" y="226" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Axios • TanStack Query</text>
  </g>

  <!-- Arrow Client -> Server -->
  <path d="M 280 240 L 320 240" stroke="#38BDF8" stroke-width="2.5" marker-end="url(#arrow)" />

  <!-- Subgraph 2: Backend & Engine -->
  <g transform="translate(325, 30)">
    <rect width="250" height="300" rx="12" fill="url(#server-grad)" stroke="#7C3AED" stroke-width="1.5" stroke-dasharray="4 4" />
    <text x="125" y="32" fill="#C084FC" font-family="'Fira Code', monospace" font-size="14" font-weight="700" text-anchor="middle">⚙️ BACKEND &amp; ENGINE</text>

    <!-- Node API Server -->
    <rect x="25" y="60" width="200" height="60" rx="8" fill="#0F172A" stroke="#C084FC" stroke-width="1.5" />
    <text x="125" y="88" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Node.js &amp; Express API</text>
    <text x="125" y="106" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">REST &amp; GraphQL Endpoints</text>

    <!-- Arrow down -->
    <path d="M 125 120 L 125 170" stroke="#C084FC" stroke-width="2" marker-end="url(#arrow-purple)" />

    <!-- Node C++ Core -->
    <rect x="25" y="180" width="200" height="60" rx="8" fill="#0F172A" stroke="#C084FC" stroke-width="2" filter="url(#glow-cyan)" />
    <text x="125" y="208" fill="#38BDF8" font-family="'Fira Code', monospace" font-size="13" font-weight="700" text-anchor="middle">⚡ C++ Core Engine</text>
    <text x="125" y="226" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">DSA &amp; Algorithmic Solver</text>
  </g>

  <!-- Arrow Server -> Data -->
  <path d="M 575 120 L 615 120" stroke="#C084FC" stroke-width="2.5" marker-end="url(#arrow-purple)" />

  <!-- Subgraph 3: Database & Storage -->
  <g transform="translate(620, 30)">
    <rect width="250" height="300" rx="12" fill="url(#data-grad)" stroke="#059669" stroke-width="1.5" stroke-dasharray="4 4" />
    <text x="125" y="32" fill="#34D399" font-family="'Fira Code', monospace" font-size="14" font-weight="700" text-anchor="middle">🗄️ DATA &amp; STORAGE</text>

    <!-- Node Prisma -->
    <rect x="25" y="60" width="200" height="50" rx="8" fill="#0F172A" stroke="#34D399" stroke-width="1.5" />
    <text x="125" y="90" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Prisma ORM Layer</text>

    <!-- Arrow down split -->
    <path d="M 85 110 L 85 170" stroke="#34D399" stroke-width="2" marker-end="url(#arrow)" />
    <path d="M 165 110 L 165 170" stroke="#34D399" stroke-width="2" marker-end="url(#arrow)" />

    <!-- Node MongoDB -->
    <rect x="15" y="180" width="105" height="60" rx="8" fill="#0F172A" stroke="#34D399" stroke-width="1.5" />
    <text x="67" y="208" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">MongoDB</text>
    <text x="67" y="224" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">NoSQL Store</text>

    <!-- Node PostgreSQL -->
    <rect x="130" y="180" width="105" height="60" rx="8" fill="#0F172A" stroke="#34D399" stroke-width="1.5" />
    <text x="182" y="208" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">PostgreSQL</text>
    <text x="182" y="224" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Relational DB</text>
  </g>
</svg>
